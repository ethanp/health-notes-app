name: health_notes
description: "A chronological health note filing system."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  ethan_utils:
    path: ../ethan_utils
  ethan_ui:
    path: ../ethan_ui
  ethan_sync:
    path: ../ethan_sync
  flutter_dotenv: ^6.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.2
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  riverpod: ^3.4.2
  stemmer: ^3.2.0
  fl_chart: ^1.1.1
  flutter_staggered_animations: ^1.1.1
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  powersync: ^1.16.2
  sqlite3: ^2.7.0
  sqlite3_flutter_libs: ^0.5.41

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8

dependency_overrides:
  sqlite3_flutter_libs: 0.5.41
  powersync: 1.16.2
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - .env
